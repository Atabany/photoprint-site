name: Validate website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  discoverability:
    runs-on: ubuntu-latest
    steps:
      - name: Read website source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pages, links, schema, sitemap, crawlers and download tracking
        run: python3 _ops/validate.py
